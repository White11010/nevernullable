name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (node ${{ matrix.node }} / ${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        node: [18, 20, 22]
        os: [ubuntu-latest]
        include:
          - node: 20
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Prettier
        run: npm run format:check

      - name: Typecheck (src)
        run: npm run typecheck

      - name: Typecheck (tests + type-tests)
        run: npm run typecheck:tests

      - name: Unit tests + coverage threshold
        run: npm run test:coverage

      - name: Build
        run: npm run build

      - name: Validate published package (publint + attw)
        if: matrix.node == 20 && matrix.os == 'ubuntu-latest'
        run: npm run validate:package

      - name: Upload coverage report
        if: matrix.node == 20 && matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          if-no-files-found: error
          retention-days: 14
